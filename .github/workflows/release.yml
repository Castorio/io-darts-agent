name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd web && npm ci
          cd ../modules/game-display/web && npm ci

      - name: Build application
        run: npm run prebuild:dist

      - name: Build Linux packages
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.snap
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd web && npm ci
          cd ../modules/game-display/web && npm ci

      - name: Build application
        run: npm run prebuild:dist

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/*.exe
          retention-days: 5

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd web && npm ci
          cd ../modules/game-display/web && npm ci

      - name: Build application
        run: npm run prebuild:dist

      - name: Build macOS packages
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 5

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -la artifacts/*/

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: IO-Darts-Agent v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/linux-builds/*
            artifacts/windows-builds/*
            artifacts/macos-builds/*
          body: |
            ## IO-Darts-Agent v${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | **Windows** | `io-darts-agent Setup *.exe` | Windows Installer (One-Click) |
            | **macOS** | `*.dmg` | macOS Disk Image |
            | **Ubuntu/Debian** | `*.deb` | Debian Package (`sudo dpkg -i *.deb`) |
            | **Linux (Universal)** | `*.AppImage` | Portable Linux App |
            | **Fedora/RHEL** | `*.rpm` | RPM Package |

            ### Installation

            **Windows:** Download and run the `.exe` installer.

            **macOS:** Download the `.dmg`, open it, and drag the app to Applications.

            **Ubuntu/Debian:**
            ```bash
            sudo dpkg -i io-darts-agent_*.deb
            sudo apt-get install -f  # Install dependencies if needed
            ```

            **Linux (AppImage):**
            ```bash
            chmod +x io-darts-agent-*.AppImage
            ./io-darts-agent-*.AppImage
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
