# IO-Darts-Agent - Electron Builder Configuration
# https://www.electron.build/configuration

appId: "io.castor.darts-agent"
productName: "IO-Darts-Agent"
copyright: "Copyright 2025 castor.io"

# No preset (electron-builder would otherwise guess one from dependencies)
extends: null

# Directories (tsc writes to dist/, so packages go to releases/)
directories:
  output: releases
  buildResources: build

# Files to include in the app.
# Built-in module handlers are compiled by the root tsc into dist/modules/*/src,
# so only their manifests and the game-display web build are needed from modules/.
# Runtime data (config, data, media, modules_installed) is not shipped: the
# desktop app keeps it in the per-user app data folder (IO_DARTS_DATA_DIR).
# Production dependencies from node_modules are added by electron-builder.
files:
  - "dist/**/*"
  - "!dist/{config,data,media,modules_installed}{,/**/*}"
  - "!dist/**/*.{map,d.ts}"
  - "web/dist/**/*"
  - "modules/*/module.json"
  - "modules/game-display/web/dist/**/*"
  - "electron/**/*"
  - "package.json"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"

# Extra resources (copied to resources folder)
extraResources:
  - from: "build/"
    to: "icons"
    filter:
      - "*.png"
      - "*.ico"
      - "*.icns"

# No asar archive: the backend runs as a separate Node process (Electron in
# ELECTRON_RUN_AS_NODE mode) with the ESM loader, resolves web/dist and the
# built-in modules through plain fs paths and symlinks modules into the data
# folder. A plain app folder keeps all of that working without asarUnpack
# special cases.
asar: false

# =====================
# macOS Configuration
# =====================
mac:
  category: "public.app-category.utilities"
  icon: "build/icon.icns"
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: "build/entitlements.mac.plist"
  entitlementsInherit: "build/entitlements.mac.plist"

dmg:
  icon: "build/icon.icns"
  iconSize: 100
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 400

# =====================
# Windows Configuration
# =====================
win:
  icon: "build/icon.ico"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "IO-Darts-Agent"
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  installerHeaderIcon: "build/icon.ico"
  license: "LICENSE"

# =====================
# Linux Configuration
# =====================
linux:
  icon: "build/icons"
  category: "Utility"
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
  maintainer: "IO-Darts-Agent <info@castor.io>"
  vendor: "castor.io"
  synopsis: "Smart Agent for Autodarts Integration"
  description: >
    IO-Darts-Agent connects your dart board to various smart home devices
    and provides a modular system for extending functionality.

deb:
  depends:
    - "libgtk-3-0"
    - "libnotify4"
    - "libnss3"
    - "libxss1"
    - "libxtst6"
    - "xdg-utils"
    - "libatspi2.0-0"
    - "libuuid1"
  priority: "optional"
  compression: "xz"

appImage:
  artifactName: "${productName}-${version}-${arch}.AppImage"

rpm:
  depends:
    - "gtk3"
    - "libnotify"
    - "nss"
    - "libXScrnSaver"
    - "libXtst"
    - "xdg-utils"

# =====================
# Publishing (optional)
# =====================
publish:
  provider: "github"
  releaseType: "release"

# Electron version to use (should match installed version)
# Note: This is set automatically by electron-builder from package.json
